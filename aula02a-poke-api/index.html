<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokédex Simplificada</title>
		<!-- Bootstrap 5 CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<style>
			.pokemon-card {
				transition: transform 0.2s ease-in-out;
			}
			.pokemon-card {
				cursor: pointer; /* o card inteiro abre o modal de detalhes */
			}
			.pokemon-card:hover {
				transform: translateY(-5px);
			}
			.sprite-box {
				background-color: #f8f9fa;
				border-radius: 0.5rem;
				text-align: center;
				padding: 0.5rem;
			}
			.sprite-box img {
				width: 96px;
				height: 96px;
				image-rendering: pixelated;
			}
			.badge-type {
				text-transform: capitalize;
				margin-right: 4px;
			}
		</style>
	</head>
	<body class="bg-light">
		<div class="container py-5">
			<header class="text-center mb-5">
				<h1 class="display-4 fw-bold text-danger">Pokédex</h1>
				<p class="lead text-secondary">
					Clique em qualquer Pokémon para abrir os detalhes completos!
				</p>
			</header>

			<!-- Área de Busca / Filtro -->
			<div class="row justify-content-center mb-4">
				<div class="col-md-6">
					<div class="input-group">
						<input
							type="text"
							id="searchInput"
							class="form-control"
							placeholder="Buscar por nome (ex: pikachu, charizard)..."
						/>
						<button class="btn btn-danger" type="button" id="searchBtn">
							Buscar
						</button>
					</div>
				</div>
			</div>

			<!-- Spinner de Carregamento -->
			<div id="loading" class="text-center my-5 d-none">
				<div
					class="spinner-border text-danger"
					role="status"
					style="width: 3rem; height: 3rem"
				>
					<span class="visually-hidden">Carregando...</span>
				</div>
			</div>

			<!-- Grid onde as cartas dos Pokémon serão inseridas -->
			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
				id="pokemonGrid"
			></div>
		</div>

		<!-- Modal de Detalhes (conteúdo preenchido dinamicamente via JS) -->
		<div
			class="modal fade"
			id="pokemonModal"
			tabindex="-1"
			aria-labelledby="pokemonModalTitle"
			aria-hidden="true"
		>
			<div class="modal-dialog modal-dialog-centered modal-lg">
				<div class="modal-content">
					<div class="modal-header bg-danger text-white">
						<h5 class="modal-title text-capitalize fw-bold" id="pokemonModalTitle">
							Detalhes
						</h5>
						<button
							type="button"
							class="btn-close btn-close-white"
							data-bs-dismiss="modal"
							aria-label="Fechar"
						></button>
					</div>
					<div class="modal-body" id="pokemonModalBody">
						<!-- Conteúdo inserido dinamicamente via JS -->
					</div>
				</div>
			</div>
		</div>

		<!-- Bootstrap 5 JS (necessário para o modal) -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

		<!-- JavaScript / Lógica com Fetch -->
		<script src="js/app.js"></script>
	</body>
</html>
